    - apps/api/src/application/catalog/product.ts
    - apps/api/src/infrastructure/postgres/product-repository.ts
    - apps/api/src/presentation/http-handler.ts
    - apps/api/openapi/health.openapi.json
    - apps/api/test/unit/product-application.test.ts
    - apps/api/test/unit/product-image.test.ts
    - apps/api/test/integration/product-http.test.ts
    - apps/api/test/integration/product-image-http.test.ts
    - apps/api/test/security/admin-product-security.test.ts
    - apps/api/test/security/product-image-security.test.ts
