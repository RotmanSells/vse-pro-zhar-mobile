id: VPZH-037
type: feature
title: Product catalog visibility management
base_commit: 70856be3d1cc6c937ed4ed56dae83dcadb0e7e66
goal: >-
  Allow an approved Admin to hide or show an existing Product in the Guest/Mobile catalog
  while preserving the Product row and keeping hidden Products recoverable in Admin.
scenario: >-
  An approved development/test Admin opens the persisted Product list, changes the catalog
  visibility of an existing Product, and receives a Backend-confirmed result; the Product is
  absent from visible Guest/Mobile reads while hidden and becomes visible again when enabled.

