  modules:
    - product-visibility-application
    - product-visibility-api
    - product-visibility-postgres-persistence
    - shared-product-visibility-contract
    - admin-product-visibility
    - product-visibility-security-tests
    - product-visibility-integration-and-e2e
    - product-visibility-documentation
  layers:
    - application
    - infrastructure
    - api-presentation
    - shared-contracts
    - admin-application
    - admin-infrastructure
    - admin-presentation
    - tests
    - documentation
  paths:
