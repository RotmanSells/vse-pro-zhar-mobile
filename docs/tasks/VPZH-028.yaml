id: VPZH-028
type: feature
title: Product catalog, base price and Admin visibility
goal: >-
  Deliver the first persisted Product vertical slice on top of the existing Category:
  an explicitly authorized local/test Admin creates a Product with one existing Category,
  name, authoritative RUB base price and explicit admin_enabled, PostgreSQL persists it,
  and Guest/Mobile reads the validated visible catalog after reload.
scenario: >-
  In an explicitly enabled development/test runtime, an approved Admin submits a Product
  through the real same-origin Admin Server Action and API boundary; Backend Application
  and Domain validate the Product and its existing Category, PostgreSQL persists the
  relation and integer RUB minor-unit price, Guest reads visible Products, and Mobile
  renders the persisted name and formatted price after reload/restart.
scope:
  modules:
    [
      product-domain,
      product-application,
      product-api,
      product-postgres-persistence,
      category-reference-boundary,
      development-admin-authorization,
      shared-product-contract,
      admin-product-create,
      mobile-product-read,
      product-security-tests,
      product-integration-and-e2e,
