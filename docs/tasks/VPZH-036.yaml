id: VPZH-036
type: chore
title: Speed up task verification pipeline
goal: >-
  Reduce feedback time for documentation-only and small code changes without weakening the
  full regression gate for executable changes, by selecting verification work from the committed
  diff, including reverse workspace dependents and reusing safe CI build/toolchain caches.
scope:
  modules:
    - task-verification
    - workspace-impact-analysis
    - pull-request-ci
    - verification-caching
    - automation-documentation
    - verification-tests
  layers:
    - tooling
    - tests
    - ci
    - documentation
  paths:
    - scripts/lib/verification-impact.mjs
    - scripts/checks/verify-task.mjs
    - scripts/checks/verify-pr.mjs
    - scripts/checks/verify-milestone.mjs
    - scripts/checks/checker-exit-codes.mjs
    - tests/unit/verify-task.test.ts
    - tests/unit/verify-pr.test.ts
    - tests/unit/verification-impact.test.ts
    - .github/workflows/verify.yml
    - AUTOMATION.md
    - package.json
    - policy/automation-registry.json
    - docs/product/roadmap.md
    - docs/tasks/VPZH-036.yaml
  in:
    - Classify a committed PR diff into documentation-only or incremental package verification from the changed paths and workspace dependency graph.
    - Run verify:task and the relevant API/Admin integration checks before the existing task contract, scope, diff-size, secrets and dependency checks.
    - Expand verify:task from directly changed workspace packages to their reverse workspace dependents, including shared contract consumers such as API and Mobile.
    - Treat root package/toolchain/configuration changes as impacting every workspace package; keep ordinary main pushes on verify:fast and reserve the complete verify gate for explicit stage closure.
    - Add package-specific verification commands and focused tests for incremental PR planning, reverse dependency selection and safe short-circuit behavior.
    - Split PR CI into cancellable root, policy, package and relevant integration jobs that can run in parallel.
    - Add versioned caches for root TypeScript/framework build outputs without caching secrets; automated Android/Maestro device E2E is disabled by owner decision and is not a CI gate.
    - Update automation and M0 roadmap documentation with the exact fast/full verification behavior, explicit stage input and safety boundary.
  out:
    - Business/application/API/database behavior, public contracts, domain rules or product UI changes.
    - Removing any required package, integration, policy, architecture, security or dependency check from the applicable PR plan.
    - Removing task contract, task scope, diff-size, secrets, dependency, integration, architecture or build gates from applicable code PRs.
    - Branch protection changes, GitHub credentials, untrusted cache keys, secret caching or changes to E2E assertions and product flows.
    - New dependencies, unrelated refactoring, provider changes or user-owned untracked files.

acceptance_criteria:
  - Documentation-only and executable PRs are classified strictly from committed diff paths; executable changes use only the impacted packages and relevant integration boundaries.
  - The PR gate always runs task contract, scope, diff-size, secrets and dependency checks after the selected fast/full verification gate, in the documented order.
  - Pushes to main run verify:fast; manual stage verification requires an explicit stage identifier and retains the existing verify command with all workspace package, integration, architecture, checker and build checks.
  - verify:task checks reverse workspace dependents when a shared workspace package changes and checks all packages when root toolchain/configuration inputs change.
  - A changed shared contract causes its direct package plus API/Mobile consumers to run typecheck and unit tests; unrelated Admin packages remain excluded unless globally impacted.
  - CI reports the incremental plan for a PR, cancels obsolete PR runs and does not start Android emulators or product E2E jobs.
  - The manual workflow requires a non-empty milestone input and routes it to VPZH_MILESTONE=<stage> pnpm verify:milestone; the milestone command runs the complete pnpm verify gate.
  - Root build caches are versioned by their relevant toolchain/lockfile inputs and contain no secrets; no Android/Gradle/Maestro/AVD cache or device job is required.
  - Focused unit tests cover the mode classifier, reverse dependency expansion and the existing full/fast subprocess behavior; no failing test is removed or weakened.
  - Automation documentation and the M0 roadmap describe the fast local gate, reverse dependency safety, full code gate and the owner-approved manual-phone boundary for Mobile acceptance.
  - The final diff remains limited to this manifest's tooling, tests, CI and documentation scope, and user-owned untracked files remain untouched.
  - 'pnpm verify, the focused checker tests and the committed VPZH-036 PR verification chain pass before this task becomes completed.'

test_plan:
  unit:
    - Test documentation-only versus executable/configuration PR mode selection and verify:pr gate ordering/short-circuit behavior.
    - Test direct workspace impact, reverse dependents for shared contracts and all-package impact for root toolchain/configuration changes.
    - Test verify:task command selection without invoking the full verify chain.
  integration:
    - Run the quick repository gate after ordinary main merges; run the full repository verification only through explicit manual stage verification, plus automation synchronization checks to prove the selected gates remain compatible with existing workspace orchestration and policy checkers.
    - Validate the workflow YAML and cache paths/keys through the committed CI configuration and a successful GitHub Actions PR run.
  e2e:
    - Automated Android/device E2E through Maestro is disabled by owner decision; no device E2E is required for documentation-only or executable changes. Mobile acceptance is manual through Expo Go on the owner's physical phone.

verification:
  commands:
    - TASK_ID=VPZH-036 pnpm check:task-contract
    - pnpm exec prettier --check docs/tasks/VPZH-036.yaml
    - git diff --check
    - pnpm test:unit
    - pnpm check:automation-sync
    - pnpm check:checker-exit-codes
    - TASK_ID=VPZH-036 pnpm check:task-scope
    - pnpm check:diff-size
    - pnpm check:secrets
    - pnpm check:dependencies
    - VPZH_MILESTONE=M0 VPZH_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/vpzh_test pnpm verify:milestone
    - TASK_ID=VPZH-036 DIFF_BASE=d8baa676525a4e07516958850fc2eff9970e4d2f pnpm verify:pr
  manual:
    - Confirm documentation-only and executable changes select the incremental plan, ordinary main pushes select verify:fast, and manual stage verification selects the full verify gate.
    - Confirm manual stage verification rejects a missing stage identifier and logs the selected stage before running the full gate.
    - Confirm shared contract changes select reverse API/Mobile dependents and root toolchain changes select all workspace packages.
    - Confirm task contract, scope, diff-size, secrets and dependency checks remain mandatory after either selected verification mode.
    - Confirm cache keys are deterministic, toolchain-bound and free of secrets; cache misses retain the existing verified setup path.
    - Confirm no Maestro/device job is started and the owner performs Mobile acceptance manually through Expo Go on a physical phone.
    - Confirm user-owned .DS_Store, apps/admin/AGENTS.md, apps/admin/CLAUDE.md and work/ remain outside the commit.

api_change: false
database_change: false
architecture_change: false
security_sensitive: true
docs_impact: true
e2e_required: false
regression_test_required: true
adr: null
status: in_progress
