id: VPZH-040
type: docs
title: Reconcile documentation with current Mobile, Admin and Backend slices
goal: >-
  Synchronize the canonical product, architecture, module and task documentation with the
  implementation present in the current working tree, while making ownership, prototype and
  verification boundaries unambiguous for the next AI agent.
scenario: >-
  A subsequent agent reads the reconciled documentation and can distinguish the committed
  baseline from unverified working-tree slices, identify Backend/Admin/iiko ownership, avoid
  mock or prototype runtime data, and select the next permitted product capability.

scope:
  modules:
    - documentation-reconciliation
    - task-status-ledger
    - catalog-ownership-boundary
    - mobile-admin-slice-documentation
    - manual-mobile-acceptance-policy
  layers:
    - documentation
    - tooling
    - ci
  paths:
    - docs/product/product-definition.md
    - docs/product/core-product-contracts.md
    - docs/product/m3-execution-plan.md
    - docs/product/roadmap.md
    - docs/architecture/overview.md
    - docs/product/VPZH-030-image-decision-draft.md
    - docs/tasks/VPZH-030.yaml
    - docs/tasks/VPZH-037.yaml
    - docs/tasks/VPZH-038.yaml
    - docs/tasks/VPZH-029.yaml
    - docs/tasks/VPZH-036.yaml
    - docs/tasks/VPZH-039.yaml
    - docs/tasks/VPZH-040.yaml
    - AUTOMATION.md
    - .github/workflows/verify.yml
    - scripts/checks/verify-milestone.mjs
    - scripts/checks/checker-exit-codes.mjs
    - apps/api/README.md
    - apps/admin/README.md
    - apps/mobile/README.md
    - packages/contracts/README.md
  in:
    - Reconcile the committed baseline and current working-tree implementation status for VPZH-029, VPZH-030, VPZH-036, VPZH-037, VPZH-038 and VPZH-039 without treating implementation presence as completion.
    - Record Backend/PostgreSQL as the sole authority for Categories, Products, names, prices, descriptions/ingredients, weight, approved labels, images and `admin_enabled`.
    - Record the real Backend-driven Admin Menu and Mobile Menu boundary, the prototype-only visual-reference rule, and the prohibition on mock catalog, demo products, fake orders, sample prices, hardcoded fallback data and localStorage runtime data.
    - Record that `admin_enabled` is catalog visibility only; iiko owns operational availability, stop-list, kitchen execution and kitchen statuses; Admin Orders remains read-only/diagnostic until its Backend/iiko contract exists.
    - Record Product details, imagery and catalog visibility as separate boundaries.
    - Describe VPZH-038 as a visual Mobile slice with Backend-driven catalog and local presentation/demo state for cart, roulette, passport and profile without production order, payment or reward side effects.
    - Describe VPZH-039 as a visual Admin slice with a prototype-aligned shell, real Backend Menu and explicit non-mutating placeholders for deferred sections.
    - Preserve completed task history and keep status `completed` only where mandatory verification evidence exists.
    - Capture the exact PostgreSQL infrastructure blocker without adding a mock verification mode.
    - Record the owner decision that automated Android/device E2E through Maestro is disabled; document manual acceptance on a physical phone through Expo Go and keep API/unit/integration/build checks mandatory.
  out:
    - Production source, API, database, migration, shared runtime contract, provider, product behavior, policy or prototype changes.
    - New product behavior, new iiko behavior, production authentication, order/payment/reward side effects or arbitrary Product flows.
    - Changing accepted ADRs or rewriting completed-task history without evidence of a real contradiction.
    - User-owned untracked files, including `.DS_Store`, `apps/admin/AGENTS.md`, `apps/admin/CLAUDE.md` and `work/`.

acceptance_criteria:
  - The selected VPZH-040 manifest validates through the canonical task-contract checker and includes itself in `scope.paths`.
  - Product Definition and Core Product Contracts state the complete catalog authority, Admin/iiko responsibility and prototype/runtime data boundaries.
  - The M3 plan and roadmap distinguish the committed baseline from current unverified worktree slices and list VPZH-029, VPZH-030, VPZH-036, VPZH-037, VPZH-038 and VPZH-039 as `in_progress` until their mandatory checks pass.
  - The M3 plan and roadmap identify VPZH-031 Local catalog search as the next permitted product capability after the current in-progress slices are verified; VPZH-032 remains conditional on its adapter-level decisions under ADR-002.
  - Admin, Mobile, API and shared-contract READMEs describe real Backend data ownership, safe explicit placeholder/error behavior and the absence of mock/demo catalog runtime data.
  - VPZH-038 and VPZH-039 documentation preserves their presentation-only/non-mutating boundaries and does not claim production cart, payment, rewards, Orders or kitchen operations.
  - VPZH-030 and VPZH-037 do not claim `completed` while the mandatory full verification is blocked; ADR-004 remains Accepted independently of VPZH-030 task completion.
  - Automated Android/device E2E through Maestro is disabled in CI and task verification by explicit owner decision; the owner manually validates the Mobile app on a physical phone through Expo Go against the local Backend/API.
  - 'The recorded verification result is exact: with `VPZH_TEST_DATABASE_URL` set to the local isolated `vpzh_test` database, `pnpm verify` passes all format, lint, typecheck, test hygiene, unit, PostgreSQL integration, architecture, automation, checker-exit-code and build gates; the previously available Maestro flows are retained only as archived optional tooling and are not a completion gate; after VPZH-041 upgrades the pinned pnpm toolchain to 11.24.0, `pnpm check:dependencies` passes, `pnpm audit --json` terminates and still reports the known moderate uuid finding while the existing image-size waiver remains explicit; no mock database, audit result or verification bypass is introduced.'
  - The diff contains only the declared documentation, verification-policy, CI and checker-orchestration changes plus user-owned untracked files left untouched.

test_plan:
  unit:
    - Validate VPZH-040 with the canonical task-contract schema and verify that every documented status is consistent with the corresponding manifest.
  integration:
    - Run documentation formatting, diff checks, automation synchronization, secret scanning and task-scope/diff-size checks against the selected manifest.
  e2e:
    - No automated device E2E is introduced or run; the task records manual physical-phone acceptance through Expo Go and preserves API/unit/integration/build evidence.

verification:
  commands:
    - TASK_ID=VPZH-040 pnpm check:task-contract
    - pnpm exec prettier --check docs/product/product-definition.md docs/product/core-product-contracts.md docs/product/m3-execution-plan.md docs/product/roadmap.md docs/architecture/overview.md docs/product/VPZH-030-image-decision-draft.md docs/tasks/VPZH-030.yaml docs/tasks/VPZH-037.yaml docs/tasks/VPZH-040.yaml apps/api/README.md apps/admin/README.md apps/mobile/README.md packages/contracts/README.md
    - git diff --check
    - TASK_ID=VPZH-040 DIFF_BASE=HEAD pnpm check:task-scope
    - TASK_ID=VPZH-040 DIFF_BASE=HEAD pnpm check:diff-size
    - pnpm check:secrets
    - pnpm check:automation-sync
    - pnpm verify:task
    - pnpm verify
  manual:
    - Confirm the current worktree contains no runtime mock catalog, demo Product/order records, sample catalog prices, hardcoded catalog fallback or localStorage catalog data.
    - Confirm the prototype paths remain visual references only and were not changed.
    - Confirm all current in-progress manifests remain in_progress until their own mandatory verification succeeds, and record any infrastructure blocker rather than substituting mocks.
    - Confirm the next permitted product capability is VPZH-031 only after this reconciliation and current task gates are cleared; prepare VPZH-032 only with its remaining adapter decisions recorded.

api_change: false
database_change: false
architecture_change: false
security_sensitive: false
docs_impact: true
e2e_required: false
regression_test_required: false
adr: null
status: in_progress
