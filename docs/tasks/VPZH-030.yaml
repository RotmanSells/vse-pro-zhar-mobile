id: VPZH-030
type: feature
title: Product imagery
goal: >-
  Add one required main image to the persisted Product flow so Admin can upload and replace
  a product image and Guests can see the Backend-confirmed image for visible Products, using
  a safe production object-storage boundary without adding a gallery or unsupported provider
  semantics.
scenario: >-
  An approved development/test Admin uploads an image file for an existing Product; the
  Backend validates the file, converts it to WebP, stores the approved image reference in
  production object storage and returns the persisted image to Mobile for a visible Product.
  Admin can replace the image, deletion is allowed only with a replacement, and a reload keeps
  the same Backend-confirmed image without exposing hidden Products or adding orderability.

