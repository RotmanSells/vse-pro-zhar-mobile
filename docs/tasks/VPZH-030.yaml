  manual:
    - Confirm ADR-004 is Accepted by the owner before implementation and that ADR-003 remains unchanged and is used only for the development/test Admin boundary.
    - Confirm the implementation base is f1c51efa5b3c6e3d0eb65b9e526dff46bfb7db32 and the final tracked diff contains only the approved VPZH-030 runtime, test, CI and documentation changes.
    - Confirm Yandex Object Storage bucket privacy, deployment-configured bucket with the documented production default, ru-central1 endpoint, bucket-scoped credentials, secret-store rotation at least every 90 days, 5-second timeout, three-attempt retry and no provider URL in public contracts.
    - Confirm all existing Product rows receive an explicit approved image before 007; missing source data stops rollout without deletion, placeholder or silent hiding, and old writers are drained before the contract migration.
    - Confirm authorization, rate limit and bounded multipart parsing happen before decode; boundary length, file/body/pixel/dimension/channel/animation/metadata/processing limits are independently tested.
    - Confirm output is WebP, EXIF orientation is applied before no-crop resize, all source metadata is removed, alpha behavior is preserved and originals are not retained.
    - Confirm hidden/unknown/stale image URLs return indistinguishable safe 404 responses, provider failures return safe 503, `private, no-cache` still permits device caching with ETag revalidation, and cache busting occurs only through a new opaque revision URL.
    - Confirm v1 Product reads remain compatible, v2 image-aware Mobile uses the shared strict contract, Admin uses the same-origin Server Action, and no gallery/orderability/iiko behavior appears.
    - Confirm user-owned `.DS_Store`, `apps/admin/AGENTS.md`, `apps/admin/CLAUDE.md` and `work/` remain outside the commit.

