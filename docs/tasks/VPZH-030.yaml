  in:
    - 'Owner-approved image decision: one required main image per Product, uploaded only by Admin as a file.'
    - 'Accepted input formats are JPG, PNG and WebP; the uploaded image is converted to WebP before storage and serving.'
    - 'Accepted limits are a 10 MB input file and a maximum 1600×1600 px output; resize preserves the full image and does not crop.'
    - 'Production uses a separate object-storage boundary; no named provider is invented by this manifest.'
    - 'An image is available to Guests only for a visible Product. Standard URL-based client caching is allowed.'
    - 'An existing image can be replaced. Because the image is required, deletion is allowed only together with a replacement in the same operation.'
    - Add one strict image reference/metadata representation to the existing Product model, shared contracts, API/OpenAPI boundary and PostgreSQL persistence without adding a gallery.
    - Add a development/test Admin upload and replacement flow through ADR-003's existing separate identity boundary and fail-closed authorization order.
    - Add bounded file validation, conversion, safe object-storage interaction, replacement behavior and migration-safe handling for existing Product rows before the mandatory-image invariant is enforced.
    - Add Mobile rendering of the Backend-confirmed WebP image for visible Product cards/details with safe loading/failure behavior and standard caching.
    - Add focused unit, integration, security, contract, Admin, Mobile and real reload E2E evidence.
    - Add or update only the automation and documentation entries required for the focused image flow.
  out:
    - Product image galleries, multiple main images, image search, remote image import or arbitrary image transformation.
    - A named storage provider, S3, Cloudinary, CDN, local production disk or provider credentials before an explicit implementation decision.
    - Original-file retention, public upload endpoints, unbounded file size, unsafe MIME trust, executable content or path-controlled storage keys.
    - Product name, Category, price, visibility, description, weight, new/hit semantics or a second Product model.
    - iiko availability, orderability, cart, checkout, payment, search, offline authority or production Admin authentication.
    - Unrelated UI redesign, new dependencies without approval, changes to prototype files or user-owned untracked files.

acceptance_criteria:
  - 'The approved decisions are recorded: one required main image, Admin file upload, JPG/PNG/WebP input, WebP output, 10 MB input limit, 1600×1600 output limit, resize without crop, replacement-only deletion and standard URL caching.'
  - Production storage is separated from the API server filesystem, uses a validated image reference and does not expose provider credentials or invent a named provider outside the approved implementation decision.
  - Every visible Product has a valid Backend-confirmed main image after the migration-safe rollout; existing Product rows are preserved and no unapproved placeholder or silent data loss is introduced.
  - Invalid extension, MIME, content signature, oversized, malformed, non-image or conversion-failing files are rejected safely before persistence and never become public assets.
  - The converted output is WebP, preserves the full source image without crop, respects the 1600×1600 maximum and is stored under a server-controlled non-guessable reference.
  - Admin upload and replacement use the real same-origin Server Action, Admin Application/client and API boundary; ADR-003 authorization and permission checks happen before persistence or storage mutation.
  - Deletion cannot leave a Product without its required image; replacement is atomic from the Product's observable perspective, and failed replacement keeps the last confirmed image.
  - Guest reads expose the image only for visible Products and return safe not-found behavior for hidden or unknown Products; no upload endpoint is identity-free.
  - Shared contracts, OpenAPI, Domain/Application ports, repository state and Mobile rendering accept only the strict Backend-confirmed image representation.
  - Mobile renders the approved image for visible Product browse/details, keeps loading and safe failure states explicit, uses standard URL-based caching and adds no gallery or order action.
  - Focused unit, integration, security, contract, Admin, Mobile and real reload E2E evidence covers valid upload/replacement, conversion, persistence, visibility and all file/security negatives.
  - The final tracked diff matches this scope, introduces no unapproved provider/dependency, preserves existing Product fields and leaves user-owned untracked files untouched.
  - 'pnpm verify, the focused Product-imagery E2E and the committed VPZH-030 PR verification chain pass before this task becomes completed.'

test_plan:
  unit:
    - Test image input validation, content-signature checks, size/dimension limits, WebP conversion, resize-without-crop and server-controlled image references.
    - Test Product image invariants, required-image rollout behavior, atomic replacement/deletion semantics and preservation of existing catalog fields.
    - Test Admin upload/replacement parsing, safe errors and Mobile image loading, loaded, failure and retry states without gallery or orderability affordances.
  integration:
    - Apply the image migration twice in an isolated PostgreSQL schema, preserve existing Product rows, persist image metadata and reload it through a restarted API/repository process.
    - Exercise the real Admin upload/replacement boundary and visible Guest read with authorization, invalid-file, hidden/unknown Product, storage and conversion failure cases.
    - Validate shared/OpenAPI contracts, object-storage adapter boundaries, cache headers/reference behavior and cleanup of replaced assets without leaking internal details.
  e2e:
    - 'Run a focused Android flow with isolated PostgreSQL, real API/Admin outputs and an approved test object-storage adapter: upload an image through Admin, open the visible Product in Mobile, assert the WebP image, replace it, reload and assert persistence.'
    - Keep the device flow limited to one main image and replacement/reload; do not assert galleries, search, iiko availability, orderability, cart or checkout.

