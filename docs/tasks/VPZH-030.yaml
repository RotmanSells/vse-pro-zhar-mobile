  in:
    - 'Implementation base is the current origin/main f1c51efa5b3c6e3d0eb65b9e526dff46bfb7db32, after VPZH-036; ADR-003 remains the only current Admin identity boundary.'
    - 'Implement exactly one required Product main image. Input is Admin file upload only; remote URL import, galleries, multiple images and arbitrary transforms are excluded.'
    - 'Use Yandex Object Storage in ru-central1 through https://storage.yandexcloud.net with a private deployment-configured bucket (production default vse-pro-zhar-product-images-prod), server-controlled product-images/{productId}/{revision}.webp keys, bucket-scoped credentials and no public or signed client URLs.'
    - 'Use an application ObjectStorage port with a Yandex S3 adapter, an in-memory unit adapter and an isolated temporary-directory test adapter; provider calls use a 5-second timeout and at most 3 attempts.'
    - 'Use sharp 0.35.4 for JPG/JPEG, PNG and WebP signature/metadata validation, EXIF orientation, no-crop resize, sRGB WebP output and metadata removal; use @fastify/busboy 3.2.2 for bounded streaming multipart parsing.'
    - 'Enforce 10 MiB file input, 10,551,296-byte multipart body, 25,000,000 decoded pixels, 10,000-pixel maximum width/height, one file, five total parts, no animation/multi-frame input, 5-second processing timeout, two concurrent transforms and 10 image mutations per Admin principal per 60 seconds.'
    - 'Add image-aware ProductWithImageResponse with exactly one client-facing imageUrl field on v2 Product reads; preserve v1 GET /products and GET /products/:id response shapes for current clients.'
    - 'Keep legacy JSON POST /admin/products only through the 006 EXPAND window, then disable it with 410 LEGACY_ENDPOINT_DISABLED at write freeze; add atomic multipart POST /v2/admin/products with categoryId, name, basePriceMinor, adminEnabled and required image.'
    - 'Add PUT /v2/admin/products/:id/image replacement with no image DELETE endpoint; serve GET /products/:productId/image/:imageRevision only after checking Product existence, admin_enabled=true and current image_revision, returning safe 404 for hidden, unknown and stale revisions without provider details.'
    - 'Make replacement upload-first and compare-and-set: processing/storage/database failure preserves the last confirmed image; a concurrent loser returns 409 and cleans its new object; old-object deletion happens after commit with bounded idempotent retry.'
    - 'Use 006_add_product_image.sql with nullable image_revision UUID for EXPAND, explicitly backfill every existing Product from an approved source image through the same pipeline, then use 007_enforce_product_image.sql to set image_revision NOT NULL only after verification and old-writer drain.'
    - 'Keep admin_enabled semantics unchanged as catalog visibility; do not create a draft/publication model. During rollout freeze legacy Product writes before backfill and before 007 so mixed versions cannot create a Product without an image.'
    - 'Extend the safe API error envelope with INVALID_REQUEST, AUTHENTICATION_REQUIRED, FORBIDDEN, NOT_FOUND, CONFLICT, LEGACY_ENDPOINT_DISABLED, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, INVALID_IMAGE and STORAGE_UNAVAILABLE mappings with no internal details.'
    - 'Update shared contracts/OpenAPI, API composition/runtime config, Admin Server Action/client/form, Mobile v2 client/rendering, focused security/integration/contract tests and manual physical-phone acceptance documentation; automated Android/Maestro E2E is disabled by owner decision.'
  out:
    - Production Admin authentication, customer identity reuse, sessions, tokens, cookies, passwords, OAuth, database Admin accounts and generic RBAC.
    - Public object-storage URLs, signed object-storage URLs, public buckets, CDN, queue, generic media service, local production disk, remote URL import and original-file retention.
    - Product gallery, multiple images, image search, crop, arbitrary editing, placeholders, image delete/archive semantics and a second Product model.
    - iiko availability, orderability, cart, checkout, payment, local search, offline authority and changes to Category, price, name, details or new/hit semantics.
    - Changes to accepted ADR-003, accepted ADR-002, prototype files or user-owned untracked files.
    - Provider infrastructure provisioning, Terraform, real production credentials, production data access and execution of production operations from tests.

acceptance_criteria:
  - 'The task base and origin/main resolve to f1c51efa5b3c6e3d0eb65b9e526dff46bfb7db32, and ADR-004 is Accepted before implementation code starts; until then this manifest remains planned.'
  - Product has exactly one required main image after the contract phase; no gallery, placeholder, silent row deletion or unapproved hidden-row rewrite is introduced.
  - Production configuration names Yandex Object Storage, ru-central1, a private deployment-configured bucket with `vse-pro-zhar-product-images-prod` as the default, endpoint, credentials source, timeout and retry policy; no provider credential reaches Admin or Mobile.
  - The object-storage port is provider-neutral, the production adapter uses Yandex S3 operations, unit tests use an in-memory adapter, and integration/API-harness tests use an isolated temporary adapter without production calls.
  - 'Legacy JSON `POST /admin/products` is accepted only during 006 EXPAND and returns `410 LEGACY_ENDPOINT_DISABLED` after write freeze; bounded multipart `POST /v2/admin/products` accepts exactly one image part and all Product fields, while `PUT /v2/admin/products/:id/image` replaces only the image and `DELETE /v2/admin/products/:id/image` is not implemented.'
  - ADR-003 identity and named image permission are checked before file processing, storage mutation or persistence; production and customer identity paths fail closed, and the mutation rate/concurrency limits are enforced.
  - Filename, extension and declared MIME are untrusted hints; the decoder alone must confirm JPEG, PNG or WebP, and malformed, truncated, unsupported, oversized, pixel-limit, animation, metadata and conversion failures return safe stable errors and never publish an object.
  - EXIF orientation is applied before resize; output is WebP, sRGB, at most 1600×1600, aspect-ratio preserving, not cropped or enlarged, with EXIF/GPS/ICC/XMP/comments/thumbnails removed and alpha preserved.
  - PostgreSQL migration 006 adds nullable `image_revision UUID`; every existing Product is backfilled from an explicit approved image source through the same pipeline; migration 007 sets `image_revision NOT NULL` only after zero NULLs and object-read verification.
  - Existing Product rows and all existing Product fields, including `admin_enabled`, are preserved; `admin_enabled` remains the sole catalog visibility flag and no Product without an image can be persisted after 007.
  - '`ProductWithImageResponse` contains current Product fields plus only `imageUrl`; v1 Product reads remain compatible, v2 reads return the validated absolute Backend URL, and the URL contains no provider endpoint, bucket or credential.'
  - 'Image serving returns only WebP for a visible Product/current revision, returns safe 404 for hidden/unknown/stale revisions, uses `Cache-Control: private, no-cache` and ETag revalidation, and returns safe 503 for storage failure.'
  - A successful replacement generates a new opaque revision and URL, commits the new Product reference only after the new object exists, removes the old object after commit, and leaves the prior confirmed image observable on every failed replacement.
  - Admin uses the same-origin Server Action and updated Application/client boundary; Mobile v2 renders one image in browse/details with explicit loading, failure and retry states and no orderability/gallery affordance.
  - Focused unit, integration, security, shared-contract/OpenAPI, Admin, Mobile and migration evidence covers valid upload/replacement, persistence, visibility, cache revision and all declared file/storage negatives; the owner performs the final image/reload acceptance manually on a physical phone through Expo Go.
  - The final tracked diff is limited to `scope.paths`, introduces only the three declared API dependencies; `@fastify/busboy` and `sharp` use the stated versions, `@aws-sdk/client-s3` is verified and pinned to the current stable version during lockfile update, user-owned untracked files remain untouched and no automated device-E2E routing is required.
  - '`pnpm verify` and the committed VPZH-030 PR verification chain pass before this task can become completed; automated Android/Maestro E2E is intentionally disabled by owner decision.'

test_plan:
  unit:
    - Test Product image reference invariants, image-aware response schemas, v1/v2 compatibility and stable URL/revision generation.
    - Test multipart boundary/field/file limits, untrusted filename/extension/MIME hints with decoder-authoritative acceptance, malformed/truncated input, pixel/dimension/channel limits, APNG/animated WebP rejection, metadata stripping, orientation and WebP resize output.
    - Test upload-first create/replace, compare-and-set concurrency, no-delete invariant, storage/processing/database failures, safe errors, cleanup retry and Admin authorization/rate/concurrency rules.
    - Test Yandex adapter command mapping/configuration and in-memory/temporary test adapters without provider calls.
    - Test Admin form/action/client and Mobile v2 loading, loaded, failure, retry and one-image rendering states.
  integration:
    - Apply migrations 001–007 twice in an isolated PostgreSQL schema, preserve existing Products, backfill image revisions, verify zero NULLs before 007 and reload the Product through a restarted API/repository process.
    - Exercise real Admin multipart create and replacement through API/Application/Domain/storage/PostgreSQL, verify visible/hidden/stale image behavior, cache headers and safe storage/conversion failure mapping.
    - Validate v1/v2 shared/OpenAPI contracts, absolute Backend URLs, no provider leakage, CAS replacement behavior and post-commit old-object cleanup.
    - Validate Admin Server Action/client and Mobile client/application boundaries with the same persisted image contract.
  e2e:
    - Automated Android/device E2E through Maestro is disabled by owner decision and must not be run as part of this task.
    - "Manual acceptance: with Expo Go on the owner's physical phone, create/open a real Backend Product with one image, verify image loading, replace it in Admin, reload Mobile and confirm the new image persists; API/integration tests cover hidden/visible and failed-replacement cases."

