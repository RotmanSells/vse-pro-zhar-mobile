    - Confirm the production object-storage provider and image-reference contract are explicitly selected before implementation; this manifest does not silently select a provider.
    - Confirm the migration-safe rollout for existing Products preserves the required-image invariant without an unapproved placeholder or data loss.
    - Confirm Admin upload remains ADR-003 development/test-only and fail-closed, with authorization before conversion, storage mutation and persistence.
    - Confirm file content is validated independently of the client MIME/extension and that conversion/storage failures retain the previous confirmed image.
    - Confirm only visible Products expose image references/assets, standard caching does not make stale data authoritative and no gallery or orderability capability appears.
