id: VPZH-030
type: feature
title: Product imagery
base_commit: c8c54a43f73d4b0a158bda52c16a18469693d20c
goal: >-
  Add exactly one required main image to the persisted Product flow: an ADR-003 development/test
  Admin uploads or replaces a file, the API validates and converts it to WebP, Yandex Object
  Storage holds the approved object, PostgreSQL holds an opaque image revision, and visible
  Guest/Mobile reads receive a Backend-controlled image URL without changing Product visibility
  or introducing a gallery.
scenario: >-
  In a non-production runtime with ADR-003 enabled, an approved Admin submits an image file for
  a new or existing Product through the real same-origin Server Action and API multipart boundary;
  the Backend validates the file, applies EXIF orientation, resizes without crop, stores WebP
  under a server-controlled key, atomically persists the opaque revision, and returns the
  image-aware Product contract. Guest/Mobile can load that image only while the Product is
  visible, and a replacement produces a new cacheable URL that survives reload.

