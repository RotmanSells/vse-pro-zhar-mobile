id: VPZH-029
type: feature
title: Product details and approved metadata
base_commit: db038ddad9a26689d29a77bf2fe2401bec0b0777
goal: >-
  Extend the persisted Product vertical slice with the approved first-release details
  and metadata so an Admin can maintain them and a Guest can open a real
  Backend-confirmed Mobile product-details view, without introducing imagery,
  operational availability, search, cart or checkout.
scenario: >-
  An approved development/test Admin updates the approved details of an existing
  persisted Product; the API validates and persists the update, and a Guest opens that
  Product from the Category catalog in Mobile and sees the current Backend-confirmed
  name, description/ingredients, weight, Category, base price and new/hit state after a
  process reload, without any claim that the Product is operationally available or
  orderable.

