  manual:
    - Confirm VPZH-029 and the current in-progress catalog slices are accepted, origin/main still resolves to the declared base and the task manifest is reconciled before changing status to in_progress.
    - Confirm search consumes only validated Category/Product data already loaded by the existing ports and performs no request after query or Category changes.
    - Confirm the declared exact matching/normalization behavior is acceptable for first release and no ranking, history, transliteration, fuzzy matching or additional searchable field has been introduced.
    - Confirm catalog failure remains visible and retryable, catalog-empty and no-search-results states are distinct, and clearing restores the existing Category browse in Backend order.
    - Confirm the final diff has no API/DB/shared-contract/dependency/ADR/CI change and leaves `.DS_Store`, `apps/admin/AGENTS.md`, `apps/admin/CLAUDE.md` and `work/` untracked and untouched.

