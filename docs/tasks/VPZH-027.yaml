id: VPZH-027
type: feature
title: Category catalog vertical slice
goal: >-
  Deliver the first persisted M3 catalog capability: an approved local/test Admin can
  create a Category through the accepted development boundary, while Guest and Mobile
  read the same Category from the real Backend and PostgreSQL path without introducing
  production Admin authentication or a richer catalog model.
scenario: >-
  In an explicitly enabled development/test runtime, an approved Admin submits a valid
  Category name through the real Admin/API path; the Backend validates the request,
  Application and Domain execute the creation, PostgreSQL persists the Category, an
  unauthenticated Guest read returns it, Mobile renders that Backend response, and a
  reload/restart returns the same persisted Category.
