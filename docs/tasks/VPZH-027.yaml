  in:
    - 'Define and implement only the minimum Category identity required by the approved scenario: UUID id and trimmed, non-empty name.'
    - 'Use the current project name validation convention as the technical bound: name is at most 200 characters after trimming; no additional product fields are introduced.'
    - Add one Admin create operation and one public Guest category-list operation using the existing REST, runtime-validation and safe-error conventions.
    - Implement the accepted ADR-003 development/test Admin boundary with the exact synthetic principal, header, opt-in flag, runtime gate and Application-layer operation authorization.
    - Persist Categories through a versioned PostgreSQL migration and a repository port/adapter with isolated migration and reload evidence.
    - Add the required shared runtime contracts and additive machine-readable API documentation for the create/list boundary and safe errors.
    - Add an Admin create form/client, a Mobile read client/application path and a category presentation that renders the validated Backend response.
    - Add focused unit, integration, security, contract and real E2E/Maestro evidence for Admin → Backend → PostgreSQL → Guest/Mobile → reload.
    - Add the dedicated root command `pnpm test:e2e:category-catalog`, backed by `scripts/e2e/category-catalog.mjs`, and register it consistently in `package.json`, `policy/automation-registry.json`, `AUTOMATION.md` and `policy/rules-map.yaml`.
    - Add additive GitHub Actions routing so VPZH-027 PRs execute the focused Category Android/Maestro E2E with isolated PostgreSQL and the existing pinned Android/Maestro conventions.
    - Preserve the existing VPZH-014 and VPZH-018–021 E2E routing unchanged and keep the ordinary required `verify` job required and unweakened.
    - 'Do not claim full Admin → Category capability from a direct API seed alone: if existing tooling cannot drive the Admin web form end-to-end, add a separate real Admin form/client integration test proving the Admin surface sends the mutation through the real API contract; do not add browser automation for this task, and stop for review if a new browser dependency becomes necessary.'
  out:
    - Product, subcategory, nested hierarchy, tags, collections, menu-section abstractions, prices, images, search, cart, checkout and iiko availability.
    - Any Category field beyond id and name, including slug, description, icon, color, sort_order, position, publication/enabled state, deletion markers, metadata or parent_id.
    - Category update, rename, delete, archive, restore, reorder, publish/unpublish or generic CRUD semantics.
    - Duplicate-name, case-insensitive uniqueness, Unicode-normalization or ordering semantics not established by the canonical product sources; no name unique constraint is selected by this task.
    - Customer identity reuse, production Admin authentication, JWT, sessions, refresh tokens, cookies, passwords, OAuth, DB Admin accounts, secrets or generic RBAC.
    - iiko client/configuration, IIKO_* behavior, simulator changes, Product mapping, Product implementation or provider calls.
    - In-memory, mock-only or fixture-only persistence and direct UI-to-database access.
    - Changes to existing customer/profile/legal behavior, unrelated CI/policy gates, prose product/architecture documentation, new ADRs or future task manifests; only the additive VPZH-027 E2E routing and required automation synchronization are in scope.
    - Any production implementation, API/OpenAPI/contract, migration, Admin, Mobile or simulator change in this manifest-review commit; this commit is manifest-only.
acceptance_criteria:
  - origin/main, the task branch base and the pre-change HEAD equal c584584f3b512a354c0c0529bc0651836c0bb99b.
  - An approved local/test Admin can create a valid Category through the real Admin/API path, and the request crosses HTTP Presentation, Application, Domain, PostgreSQL Infrastructure and composition boundaries.
  - Category has exactly the approved minimum fields id and name; id follows the current PostgreSQL/API UUID convention, and no Product or parent field is implemented.
  - Category name is trimmed, rejects an empty result, accepts no more than 200 characters after trimming, and receives no unapproved duplicate-name uniqueness or ordering rule.
  - 'The Admin mutation accepts only kind=development_admin, subject=development-admin, role=admin from X-VPZH-Development-Admin-Identity: admin when NODE_ENV resolves to development or test and VPZH_ENABLE_DEVELOPMENT_ADMIN_IDENTITY is exactly true.'
  - Missing, empty, malformed, wrong-value or duplicate Admin identity, a disabled boundary, and production runtime with the header and flag all return 401 AUTHENTICATION_REQUIRED with the safe message Authentication required before Application or persistence.
  - X-VPZH-Development-Identity and customer phone values never authorize the Admin mutation; an Admin principal never authorizes customer /me/* operations.
  - A principal without the named Category-create permission returns 403 FORBIDDEN with the safe message Forbidden; authentication alone is not global mutation permission.
  - No Admin session, token, cookie, customer record, password or persisted Admin credential is created, and the Admin header value is not logged.
  - The real PostgreSQL migration is versioned, applies cleanly and idempotently to an isolated test schema, and the created Category survives a later process/app reload.
  - Guest GET /categories requires neither customer nor Admin identity and returns the persisted Category through the real read path.
  - Mobile displays the validated Backend Category response, not a fixture or local-only category, and after reload/restart displays the same persisted Category.
  - Invalid Category input and malformed external responses return stable safe validation errors without stack traces, SQL, secrets, headers or internal details.
  - No Product, subcategory, delete/archive/reorder semantics or iiko implementation is present.
  - Unit, integration, contract, security and focused E2E evidence covers the observable vertical scenario and the required negative Admin-boundary cases.
  - VPZH-027 pull-request CI has additive routing that actually executes the focused Category Android/Maestro E2E job with isolated PostgreSQL before task completion.
  - The focused VPZH-027 E2E job succeeds before task completion; a direct API seed alone is not accepted as full Admin evidence.
  - If the existing tooling does not drive the Admin web form end-to-end, a separate real Admin form/client integration test proves that the Admin surface sends the Category mutation through the real API contract.
  - Existing VPZH-014 and VPZH-018–021 E2E routing remains intact, the ordinary required `verify` job remains required, and no CI/check weakening or replacement occurs.
  - '`pnpm check:automation-sync` passes after `test:e2e:category-catalog` is registered.'
  - pnpm verify and the PR verification chain pass before the implementation task is considered complete; this manifest remains status planned until review.
test_plan:
  unit:
    - Validate Category id/name domain and Application behavior for trimming, empty input, the 200-character technical bound and preservation of unspecified duplicate-name semantics.
    - Validate the shared Category request/response schemas, additive FORBIDDEN error shape and safe invalid-request mapping.
    - Validate the Admin resolver's exact header value, duplicate/non-string rejection, exact opt-in flag, development/test runtime gate and production fail-closed behavior.
    - Validate Application-layer Category-create authorization for the admin role/operation and rejection of a missing permission.
    - Validate the Mobile Category Application state keeps only a successful schema-validated Backend response and exposes safe loading/error/retry states.
  integration:
    - Apply the Category migration twice to a clean isolated PostgreSQL schema and verify the migration registry, parameterized repository persistence and later reload.
    - Exercise Admin POST /admin/categories through the real HTTP composition, Admin boundary, Application/Domain and PostgreSQL repository, then read the created row through Guest GET /categories.
    - Exercise Guest read without either identity header and verify invalid input, stable errors and no direct UI-to-database path.
    - 'Exercise all required Admin security negatives: missing, malformed, wrong, duplicate, disabled, production, customer-header reuse, customer /me/* isolation, insufficient permission and no credential persistence/logging.'
    - Exercise the real Mobile Category client against the API composition and isolated PostgreSQL, then reload and compare the Backend-confirmed Category.
    - Exercise the real Admin form/client integration boundary, or the existing Admin web form if current tooling supports it, and prove the mutation is sent through the real Category API contract rather than seeded directly into PostgreSQL.
    - Validate the additive OpenAPI/shared-contract description against the implemented HTTP behavior.
  e2e:
    - Run `pnpm test:e2e:category-catalog` as a focused isolated-PostgreSQL flow that starts the real API and Admin outputs, performs the approved Admin Category create over the real mutation contract, drives the real Mobile build with the existing pinned Maestro conventions, asserts the same Category from Guest read, reloads/restarts Mobile and asserts persistence.
    - Require the dedicated VPZH-027 GitHub Actions job to execute and pass this focused E2E on VPZH-027 pull requests; do not introduce a browser automation dependency for this manifest.
    - Keep .maestro/m1-health.yaml and the existing customer-profile flow unchanged; the Category flow is a separate focused scenario and never uses fixture-only or mock-server data.
