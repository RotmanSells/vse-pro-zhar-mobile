    - pnpm check:diff-size
    - pnpm check:secrets
    - pnpm check:dependencies
    - pnpm verify
    - TASK_ID=VPZH-027 DIFF_BASE=c584584f3b512a354c0c0529bc0651836c0bb99b pnpm verify:pr
  manual:
    - Confirm the manifest is validated before any production implementation change and remains status planned during manifest review.
    - Confirm the only tracked file in this task commit is docs/tasks/VPZH-027.yaml and existing untracked user files remain untouched and untracked.
    - Confirm Category is limited to UUID id and name, uses no prototype-only field, has no name unique constraint, and leaves duplicate/order semantics unresolved rather than inventing them.
    - Confirm ADR-003 is followed exactly, production always fails closed, customer/Admin identities are separate, no credential/session/customer record is persisted and the header is not logged.
    - Confirm Guest read is unauthenticated, Mobile uses the real Backend response, PostgreSQL is the source of persistence and reload evidence is real.
    - Confirm no Product, iiko, simulator, delete/archive/reorder, production Admin auth, future manifest or unrelated customer/profile/legal change is present.
    - Confirm the focused Category E2E is separate from M1 and customer-profile flows and runs against isolated PostgreSQL.
