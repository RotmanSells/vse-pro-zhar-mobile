appId: com.rotmansells.vseprozhar
---
- launchApp:
    clearState: true
- assertVisible:
    id: development-identity-panel
- tapOn:
    id: development-identity-phone
- inputText: '79180180000'
- tapOn: Продолжить
- extendedWaitUntil:
    visible:
      id: development-profile-connected
    timeout: 15000
- assertVisible: Test identity подключена к backend
- assertVisible: 'Телефон: 79180180000'
- tapOn:
    id: development-profile-name
- inputText: Ivan
- hideKeyboard
- scrollUntilVisible:
    element:
      id: development-profile-birthday
    direction: DOWN
- tapOn:
    id: development-profile-birthday
- inputText: '1990-02-03'
- hideKeyboard
- tapOn: Сохранить профиль
- extendedWaitUntil:
    visible:
      id: development-profile-saved
    timeout: 15000
- assertVisible: Профиль сохранён в backend
- assertVisible: 'Имя: Ivan'
- assertVisible: 'Дата рождения: 1990-02-03'
- scrollUntilVisible:
    element:
      text: 'Принять тестовую Privacy Policy'
    direction: DOWN
- tapOn: 'Принять тестовую Privacy Policy'
- extendedWaitUntil:
    visible:
      id: development-legal-privacy_policy-accepted
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Принять тестовую User Agreement'
    direction: DOWN
- tapOn: 'Принять тестовую User Agreement'
- extendedWaitUntil:
    visible:
      id: development-legal-user_agreement-accepted
    timeout: 15000
- scrollUntilVisible:
    element:
      id: development-identity-phone
    direction: UP
- tapOn: Продолжить
- extendedWaitUntil:
    visible:
      id: development-legal-privacy_policy-accepted
    timeout: 15000
- assertVisible:
    id: development-legal-user_agreement-accepted
