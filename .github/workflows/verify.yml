name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Owner decision: automated Android/Maestro device E2E is disabled. Mobile acceptance is
# performed manually by the owner on a physical phone through Expo Go against the local API.
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      VPZH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vpzh_test
    services:
      postgres:
        image: postgres:16.4
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vpzh_test
        options: >-
          --health-cmd="pg_isready -U postgres -d vpzh_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.14.1
          cache: pnpm
      - name: Restore TypeScript and framework build caches
        uses: actions/cache@v4
        with:
          path: |
            apps/admin/.next/cache
            apps/mobile/.expo
          key: verify-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'apps/admin/next.config.*', 'apps/admin/package.json', 'apps/mobile/app.json', 'apps/mobile/package.json') }}
          restore-keys: |
            verify-build-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Resolve PR task identity
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "TASK_ID=$(node scripts/checks/pr-task-id.mjs)" >> "$GITHUB_ENV"
      - name: Set PR diff base
        if: github.event_name == 'pull_request'
        run: echo "DIFF_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
      - name: Verify pull request
        if: github.event_name == 'pull_request'
        run: pnpm verify:pr
      - name: Verify main
        if: github.event_name == 'push'
        run: pnpm verify
